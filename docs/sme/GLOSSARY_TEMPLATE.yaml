## Validation Rules

1. **Term uniqueness**: `term` must be unique across glossary
2. **Synonyms uniqueness**: No synonym should appear in another term's synonyms
3. **Technical mapping completeness**: At least one mapping per source system in scope
4. **Confidence threshold**: Minimum 3 for production use
5. **Validation workflow**: draft → reviewed → validated → approved
5. **Cross-reference integrity**: All `related_terms` must exist in glossary

