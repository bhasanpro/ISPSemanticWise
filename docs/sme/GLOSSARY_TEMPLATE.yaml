## Import/Export

### Import Command
```bash
python scripts/import_glossary.py --file glossary.yaml --validate
```

### Export Command
```bash
python scripts/export_glossary.py --format yaml --output glossary_export.yaml
```

### Validation Script
```python
# validate_glossary.py
def validate_glossary(glossary: list) -> list:
    errors = []
    terms = {item['term'] for item in glossary}
    synonyms = set()
    
    for item in glossary:
        # Check term uniqueness
        if item['term'] in terms - {item['term']}:
            errors.append(f"Duplicate term: {item['term']}")
        
        # Check synonyms uniqueness
        for syn in item.get('synonyms', []):
            if syn in synonyms:
                errors.append(f"Duplicate synonym: {syn}")
            synonyms.add(syn)
        
        # Check technical mappings
        if not item.get('technical_mappings'):
            errors.append(f"No technical mappings for {item['term']}")
        
        # Check confidence
        if item.get('confidence_score', 0) < 3:
            errors.append(f"Low confidence for {item['term']}: {item['confidence_score']}")
        
        # Check validation status
        if item.get('validation_status') not in ['draft', 'reviewed', 'validated', 'approved']:
            errors.append(f"Invalid validation_status for {item['term']}")
    
    return errors
```