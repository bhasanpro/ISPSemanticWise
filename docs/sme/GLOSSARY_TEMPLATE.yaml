# Business Glossary Template
## ISPSemanticWise - Standard Format

### Instructions
- One entry per business term
- Use YAML format for machine readability
- All fields required unless marked optional
- Confidence score: 1-5 (5 = authoritative, 1 = tentative)
- Validation status: draft/reviewed/validated/approved

---

## Template

```yaml
# Business Term Entry
# --- REQUIRED FIELDS ---
id: "uuid-v4"                    # Auto-generated unique identifier
term: "Settlement Amount"        # Standard authoritative term
synonyms:                        # List of all known synonyms/aliases
  - "Settle Amount"
  - "Settlement Amt"
  - "SETT_AMT"
  - "Settlement Value"
definition: >                    # 2-3 sentence business definition
  The final monetary amount to be settled for a trade after all 
  adjustments, fees, and taxes have been applied. This is the amount 
  that moves between counterparties on settlement date.
category: "settlement"           # One of: trade, settlement, counterparty, risk, fee, ca, regulatory, general
confidence_score: 5              # 1-5 scale (5=authoritative, validated by SME)
source_system: "manual"          # Origin: manual, ab_initio, oracle, unix, jira, confluence, email

# --- TECHNICAL MAPPINGS ---
technical_mappings:
  - source: "ab_initio"          # Source system
    graph: "G_TRADE_ENRICH"      # Ab Initio graph name
    port: "SETT_AMT"             # Port/field name
    transform: "CAST(REPLACE(IN_SETT_RAW, ',', '') AS DECIMAL(18,2)) * (1 + NVL(FEE_PCT, 0))"
    business_rule: "Fee schedule applied to raw settlement amount"
    confidence: 5
  - source: "oracle"             # Source system
    table: "TRADE_ENRICHED"      # Table name
    column: "SETT_AMT"           # Column name
    type: "NUMBER(18,2)"         # Data type
    description: "Enriched settlement amount with fees applied"
    confidence: 5
  - source: "oracle"
    table: "RECON_RESULTS"
    column: "ENRICHED_SETT_AMT"
    type: "NUMBER(18,2)"
    description: "Settlement amount used in reconciliation"
    confidence: 5
  - source: "oracle"
    table: "CONFIRMATIONS"
    column: "CONF_AMT"
    type: "NUMBER(18,2)"
    description: "Counterparty confirmed settlement amount"
    confidence: 5
  - source: "unix"
    script: "pre_process_trades.ksh"
    variable: "SETTLEMENT_AMOUNT"
    transform: "awk gsub(/,/, '', \$5)"
    confidence: 4

# --- RELATIONSHIPS ---
related_terms:
  - "Settlement Date"
  - "Settlement Currency"
  - "Trade Amount"
  - "Fee Percentage"
  - "Break Code SAMT"
  - "Confirmation Amount"

# --- METADATA ---
validation_status: "validated"   # draft, reviewed, validated, approved
validated_by: "Jane Smith"       # SME name
validated_at: "2026-01-15"       # ISO date
created_at: "2026-01-10"
updated_at: "2026-01-15"
version: 1
tags: ["settlement", "reconciliation", "revenue", "regulatory"]
```

---

## Field Reference

| Field | Required | Type | Description |
|-------|----------|------|-------------|
| `id` | Yes | UUID v4 | Unique identifier |
| `term` | Yes | String | Authoritative term name |
| `synonyms` | Yes | List[String] | All known variants |
| `definition` | Yes | String | 2-3 sentence business definition |
| `category` | Yes | Enum | One of: trade, settlement, counterparty, risk, fee, ca, regulatory, general |
| `confidence_score` | Yes | Integer 1-5 | 5=authoritative, 1=tentative |
| `source_system` | Yes | String | Origin of term |
| `technical_mappings` | Yes | List[Object] | See mapping structure below |
| `related_terms` | No | List[String] | Related business terms |
| `validation_status` | Yes | Enum | draft, reviewed, validated, approved |
| `validated_by` | Yes | String | SME name |
| `validated_at` | Yes | Date | ISO 8601 date |
| `version` | Yes | Integer | Version number |
| `tags` | No | List[String] | Searchable tags |

### Technical Mapping Structure

```yaml
technical_mappings:
  - source: "ab_initio|oracle|unix|pyspark|jira|confluence|email"
    # For Ab Initio
    graph: "G_TRADE_ENRICH"          # Graph name
    port: "SETT_AMT"                 # Port name
    transform: "CAST(REPLACE(...))"  # Transformation logic
    business_rule: "Fee applied"     # Business meaning
    
    # For Oracle
    table: "TRADE_ENRICHED"          # Table name
    column: "SETT_AMT"               # Column name
    type: "NUMBER(18,2)"             # Data type
    
    # For Unix
    script: "pre_process_trades.ksh" # Script name
    variable: "SETTLEMENT_AMOUNT"    # Variable name
    transform: "awk gsub(...)"       # Extraction logic
    
    # Common
    transform: "CAST(...) * (1+FEE)" # Transformation logic
    business_rule: "Fee applied"     # Business meaning
    confidence: 5                    # 1-5 confidence
```

