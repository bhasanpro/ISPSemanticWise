[build-system]
requires = ["setuptools>=68.0", "wheel", "maturin"]
build-backend = "setuptools.build_meta"

[tool.uv.extra-build-dependencies]
cx-oracle = ["pkg_resources"]
pydantic-core = ["maturin"]
isp-semantic-wise = ["setuptools"]

[project]
name = "isp-semantic-wise"
version = "0.1.0"
description = "SME Knowledge Builder for Capital Markets Post-Trade Management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "openai==1.12.0",
    "langchain==0.1.12",
    "langchain-core==0.1.35",
    "langchain-openai==0.1.0",
"neo4j==5.19.0",
    "networkx==3.2.1",
    "sqlalchemy==2.0.29",
    "oracledb==2.5.0",
    "alembic==1.13.1",
    "ruamel.yaml==0.18.6",
    "xmltodict==0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "ragas==0.1.2",
    "black==24.3.0",
    "isort==5.13.2",
    "mypy==1.9.0",
    "ruff==0.3.0",
    "pre-commit==3.6.0",
]
tree-sitter = ["tree-sitter==0.21.3", "tree-sitter-python==0.25.0", "tree-sitter-bash==0.25.1"]
pinecone = ["pinecone-client==3.0.0"]
weaviate = ["weaviate-client==4.6.0"]
chromadb = ["chromadb==0.4.24"]
c-extensions = ["sentence-transformers==3.0.1", "pandas==2.2.1", "numpy==1.26.4", "email-reply-parser==0.5.12", "beautifulsoup4==4.12.3", "atlassian-python-api==3.41.0", "lxml==5.2.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["isp_semantic_wise*"]

[tool.uv]
# uv-specific configuration
dev-dependencies = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "ragas==0.1.2",
    "black==24.3.0",
    "isort==5.13.2",
    "mypy==1.9.0",
    "ruff==0.3.0",
    "pre-commit==3.6.0",
]

[tool.uv.pip]
# uv pip configuration
compile-bytecode = true
link-mode = "copy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "llm: Tests requiring LLM calls",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE",
]
ignore = ["E501", "B008"]
[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.coverage.run]
source = ["src/isp_semantic_wise"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]